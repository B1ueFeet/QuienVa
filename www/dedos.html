<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#080810" />
  <title>¿Quién va? · Modo Dedos</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="dedos-page">
  <div id="flood"></div>

  <div class="screen active" id="finger-idle">
    <button class="btn-back" id="f-back-btn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M15 18l-6-6 6-6" />
      </svg>
      Inicio
    </button>

    <div class="f-hand">☝️</div>
    <div class="f-title">Modo Dedos</div>
    <p class="f-instr">Todos apoyan un<br><em>dedo en la pantalla</em></p>
    <div class="f-badge" id="f-badge">Sin dedos aún</div>
  </div>

  <div class="screen hidden" id="finger-cd">
    <div class="cd-label">Eligiendo en…</div>
    <div class="cd-num" id="cd-num">3</div>
  </div>

  <div class="screen hidden" id="finger-result">
    <div class="res-eyebrow">¡El elegido es!</div>
    <div class="winner-blob" id="f-winner-blob">☝️</div>
    <div class="winner-name" id="f-winner-name">Jugador Rojo</div>
    <div class="winner-sub" id="f-winner-sub"></div>

    <button class="btn-replay" id="f-replay-btn" type="button">Volver a jugar</button>
    <button class="btn-back" id="f-home-btn" type="button" style="position:static;margin-top:10px;font-size:13px">
      ← Inicio
    </button>
  </div>

  <div id="toast"></div>

  <script src="common.js"></script>
  <script src="dedos.js"></script>
</body>
</html>

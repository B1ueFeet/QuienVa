<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#080810" />
  <title>¿Quién va?</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="screen active" id="home">
    <div class="home-logo">¿Quién va?</div>
    <div class="home-tag">Elige un modo</div>

    <div class="mode-cards">
      <div class="mode-card finger-card" onclick="window.location.href='dedos.html'">
        <div class="card-icon">☝️</div>
        <div class="card-body">
          <div class="card-title">Modo Dedos</div>
          <div class="card-desc">Todos ponen un dedo y la app elige al azar</div>
        </div>
        <div class="card-arrow">›</div>
      </div>

      <div class="mode-card wheel-card" onclick="window.location.href='ruleta.html'">
        <div class="card-icon">🎡</div>
        <div class="card-body">
          <div class="card-title">Modo Ruleta</div>
          <div class="card-desc">Agrega los nombres y gira la ruleta</div>
        </div>
        <div class="card-arrow">›</div>
      </div>
    </div>
  </div>
</body>
</html>
